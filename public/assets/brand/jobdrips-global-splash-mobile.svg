<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFDFC"/><stop offset=".52" stop-color="#FAF6F2"/><stop offset="1" stop-color="#F0E6DF"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#D9A68A" stop-opacity=".55"/><stop offset=".55" stop-color="#B76E4D" stop-opacity=".12"/><stop offset="1" stop-color="#B76E4D" stop-opacity="0"/></radialGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D9A68A"/><stop offset=".5" stop-color="#B76E4D"/><stop offset="1" stop-color="#8F4C32"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".94"/><stop offset="1" stop-color="#F7E9DF" stop-opacity=".78"/></linearGradient>
<radialGradient id="planet" cx="34%" cy="28%" r="78%"><stop offset="0" stop-color="#FFF8F2"/><stop offset=".35" stop-color="#F4D5C0"/><stop offset=".66" stop-color="#C98768"/><stop offset=".88" stop-color="#8F4C32"/><stop offset="1" stop-color="#5B3024"/></radialGradient>
<radialGradient id="atmosphere" cx="35%" cy="28%" r="70%"><stop offset=".68" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".88" stop-color="#D9A68A" stop-opacity=".25"/><stop offset="1" stop-color="#B76E4D" stop-opacity=".62"/></radialGradient>
<linearGradient id="continent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF1E7" stop-opacity=".78"/><stop offset="1" stop-color="#B76E4D" stop-opacity=".35"/></linearGradient>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#5B3828" flood-opacity=".13"/></filter>
<filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
<filter id="planetShadow" x="-35%" y="-35%" width="170%" height="170%"><feDropShadow dx="10" dy="20" stdDeviation="22" flood-color="#5B3024" flood-opacity=".25"/></filter>
<filter id="glowFilter" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
<clipPath id="globeClip"><circle id="clipCircle" cx="0" cy="0" r="1"/></clipPath>
<style>
.title{font-family:Inter,Arial,sans-serif;fill:#2B1F1A}.sub{font-family:Inter,Arial,sans-serif;fill:#6B5A52}.label{font-family:Inter,Arial,sans-serif;font-weight:700;fill:#2B1F1A}.small{font-family:Inter,Arial,sans-serif;fill:#6B5A52}.card{fill:url(#glass);stroke:#E5C9B6;stroke-width:1.2}
.orbit{fill:none;stroke:url(#gold);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:10 12}
@keyframes dash{to{stroke-dashoffset:-220}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes pulse{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1.2)}}
@keyframes globeSpin{from{transform:translateX(-16px)}to{transform:translateX(16px)}}@keyframes globeSpinReverse{from{transform:translateX(16px)}to{transform:translateX(-16px)}}
@keyframes shine{0%,100%{opacity:.25}50%{opacity:.7}}@keyframes cityPulse{0%,100%{opacity:.55}50%{opacity:1}}
.moving{animation:dash 7s linear infinite}.floating{animation:float 4.8s ease-in-out infinite}.pulseDot{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
.globe-surface{animation:globeSpin 9s ease-in-out infinite alternate}.globe-surface-reverse{animation:globeSpinReverse 11s ease-in-out infinite alternate}
.globe-shine{animation:shine 4s ease-in-out infinite}.city-light{animation:cityPulse 2.8s ease-in-out infinite}
</style></defs>
<rect width="390" height="844" fill="url(#bg)"/><circle cx="195" cy="505" r="210" fill="url(#glow)" filter="url(#blur)"/>
<g transform="translate(35 42) scale(1)"><g>
<defs><linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D9A68A"/><stop offset=".55" stop-color="#B76E4D"/><stop offset="1" stop-color="#8F4C32"/></linearGradient></defs>
<path d="M38 8C23 27 12 40 12 57c0 18 12 30 27 30s27-12 27-30C66 42 55 29 38 8Z" fill="url(#logoGrad)"/>
<path d="M39 38c-8 10-13 17-13 24 0 7 5 12 13 12s13-5 13-12c0-7-5-14-13-24Z" fill="#FAF6F2"/>
<path d="M39 49c-4 6-6 9-6 13 0 4 2 6 6 6s6-2 6-6c0-4-2-7-6-13Z" fill="#D9A68A"/>
<text x="82" y="64" font-family="Inter,Arial,sans-serif" font-size="43" font-weight="700" fill="#2B1F1A">Job</text>
<text x="156" y="64" font-family="Inter,Arial,sans-serif" font-size="43" font-weight="700" fill="#B76E4D">Drips</text></g></g>
<text x="195" y="152" text-anchor="middle" class="sub" font-size="10.5" letter-spacing="2.6">CONNECTING TALENT WITH OPPORTUNITY</text>
<g transform="translate(32 192)"><text class="title" font-size="29" font-weight="700">Your career,</text><text class="title" y="36" font-size="29" font-weight="700">connected globally.</text><rect y="56" width="58" height="3" rx="2" fill="#B76E4D"/></g>

<g>
  <ellipse cx="195" cy="684" rx="104.39999999999999" ry="20" fill="#8F4C32" opacity=".16" filter="url(#blur)"/>
  <circle cx="195" cy="505" r="177" fill="url(#glow)" opacity=".75" filter="url(#blur)"/>
  <g filter="url(#planetShadow)">
    <circle cx="195" cy="505" r="145" fill="url(#planet)"/>
    <circle cx="195" cy="505" r="149" fill="url(#atmosphere)"/>
  </g>

  <clipPath id="globeClip195505"><circle cx="195" cy="505" r="144"/></clipPath>

  <!-- rotating 3D surface -->
  <g clip-path="url(#globeClip195505)" class="globe-surface">
    <!-- curved latitude bands -->
    <ellipse cx="195" cy="413" rx="133.4" ry="29.0" fill="none" stroke="#FFF8F2" stroke-opacity=".22" stroke-width="2"/>
    <ellipse cx="195" cy="460" rx="142.1" ry="55.1" fill="none" stroke="#FFF8F2" stroke-opacity=".28" stroke-width="2"/>
    <ellipse cx="195" cy="505" rx="145" ry="84.1" fill="none" stroke="#FFF8F2" stroke-opacity=".30" stroke-width="2.2"/>
    <ellipse cx="195" cy="553" rx="139.2" ry="55.1" fill="none" stroke="#FFF8F2" stroke-opacity=".25" stroke-width="2"/>
    <ellipse cx="195" cy="597" rx="127.6" ry="27.55" fill="none" stroke="#FFF8F2" stroke-opacity=".18" stroke-width="2"/>

    <!-- curved longitude bands -->
    <ellipse cx="90" cy="505" rx="33.35" ry="145" fill="none" stroke="#FFF8F2" stroke-opacity=".20" stroke-width="2"/>
    <ellipse cx="143" cy="505" rx="75.4" ry="145" fill="none" stroke="#FFF8F2" stroke-opacity=".27" stroke-width="2"/>
    <ellipse cx="195" cy="505" rx="110.2" ry="145" fill="none" stroke="#FFF8F2" stroke-opacity=".28" stroke-width="2.2"/>
    <ellipse cx="247" cy="505" rx="75.4" ry="145" fill="none" stroke="#FFF8F2" stroke-opacity=".22" stroke-width="2"/>
    <ellipse cx="300" cy="505" rx="33.35" ry="145" fill="none" stroke="#FFF8F2" stroke-opacity=".16" stroke-width="2"/>

    <!-- stylized continent silhouettes, deliberately abstract -->
    <path d="M 45 413 C 73 389,103 403,119 433
             C 103 455,85 462,89 489
             C 63 483,41 457,45 413Z"
          fill="url(#continent)" opacity=".72"/>
    <path d="M 150 355 C 190 345,220 373,213 401
             C 199 423,221 447,205 473
             C 191 499,167 481,161 450
             C 143 423,129 388,150 355Z"
          fill="url(#continent)" opacity=".62"/>
    <path d="M 261 469 C 289 447,328 459,340 488
             C 318 507,308 530,277 537
             C 256 517,247 494,261 469Z"
          fill="url(#continent)" opacity=".54"/>
    <path d="M 180 540 C 210 527,237 546,229 578
             C 212 610,191 637,172 616
             C 160 587,160 560,180 540Z"
          fill="url(#continent)" opacity=".66"/>

    <!-- city lights -->
    <g fill="#FFF4E6">
      <circle cx="77" cy="459" r="3.5" class="city-light"/>
      <circle cx="108" cy="486" r="2.8" class="city-light" style="animation-delay:.4s"/>
      <circle cx="164" cy="414" r="3.2" class="city-light" style="animation-delay:.8s"/>
      <circle cx="203" cy="450" r="3.5" class="city-light" style="animation-delay:1.1s"/>
      <circle cx="271" cy="491" r="3.2" class="city-light" style="animation-delay:.5s"/>
      <circle cx="305" cy="525" r="2.7" class="city-light" style="animation-delay:1.5s"/>
      <circle cx="215" cy="578" r="3" class="city-light" style="animation-delay:1.9s"/>
      <circle cx="141" cy="587" r="2.7" class="city-light" style="animation-delay:1.3s"/>
    </g>

    <!-- moving sunrise highlight -->
    <ellipse cx="147" cy="423" rx="50.75" ry="79.75" fill="#FFFFFF" opacity=".13" filter="url(#blur)" class="globe-shine"/>
  </g>

  <!-- crisp atmospheric rim -->
  <circle cx="195" cy="505" r="148" fill="none" stroke="#F8DCC9" stroke-opacity=".72" stroke-width="3"/>
  <circle cx="195" cy="505" r="155" fill="none" stroke="#B76E4D" stroke-opacity=".20" stroke-width="2"/>

  <!-- foreground orbital arcs give depth -->
  <path d="M 16 527 C 144.25 367.25 303.75 362.9 378 487"
        fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round" opacity=".82" class="moving"/>
  <path d="M 30 543 C 173.25 652.9 299.4 638.4 365 510"
        fill="none" stroke="#F2D7C3" stroke-width="5" stroke-linecap="round" opacity=".65"/>

  <circle cx="70" cy="445" r="6" fill="#FFF4E6" class="pulseDot"/>
  <circle cx="307" cy="535" r="6" fill="#FFF4E6" class="pulseDot" style="animation-delay:.8s"/>
</g>
<ellipse cx="195" cy="505" rx="205" ry="70" class="orbit moving" transform="rotate(-18 195 505)"/>
<ellipse cx="195" cy="505" rx="190" ry="92" class="orbit moving" transform="rotate(24 195 505)" style="animation-duration:9s"/>
